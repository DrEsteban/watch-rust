name: Build and Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [ "published" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  WINGET_PACKAGE_IDENTIFIER: DrEsteban.watch-rs

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets --verbose

      - name: Build release
        run: cargo build --release --verbose

      - name: Smoke test release binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./target/release/watchr --help
          ./target/release/watchr --version

      - name: Smoke test release binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          .\target\release\watchr.exe --help
          .\target\release\watchr.exe --version

      - name: Install WiX Toolset
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $wixBin = Join-Path $programFilesX86 'WiX Toolset v3.14\bin'
          if (!(Test-Path $wixBin) -and $env:WIX) {
            $wixBin = Join-Path $env:WIX 'bin'
          }
          if (!(Test-Path $wixBin)) {
            throw "WiX Toolset bin directory was not found"
          }
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install cargo-wix
        if: matrix.os == 'windows-latest'
        run: cargo install cargo-wix --version 0.3.9 --locked

      - name: Build Windows MSI
        if: matrix.os == 'windows-latest'
        run: cargo wix --no-build --output target/wix

      - name: Upload Windows MSI
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: watchr-windows-msi
          path: target/wix/*.msi

  winget:
    name: Submit Windows MSI to WinGet
    if: github.event_name == 'release'
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows MSI
        uses: actions/download-artifact@v4
        with:
          name: watchr-windows-msi
          path: target/wix

      - name: Upload MSI to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi = Get-ChildItem -Path target/wix -Filter *.msi | Select-Object -First 1
          if ($null -eq $msi) {
            throw "No MSI was found in target/wix"
          }
          gh release upload "${{ github.event.release.tag_name }}" $msi.FullName --clobber --repo "${{ github.repository }}"

      - name: Install .NET runtime for Winget-Create
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.x'

      - name: Install Winget-Create
        shell: pwsh
        run: Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Submit WinGet package update
        shell: pwsh
        env:
          WATCHR_GITHUB_PAT: ${{ secrets.WATCHR_GITHUB_PAT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WATCHR_GITHUB_PAT)) {
            throw "WATCHR_GITHUB_PAT secret is required to submit the WinGet package update"
          }

          $msi = Get-ChildItem -Path target/wix -Filter *.msi | Select-Object -First 1
          if ($null -eq $msi) {
            throw "No MSI was found in target/wix"
          }

          $version = "${{ github.event.release.tag_name }}" -replace '^v', ''
          $installerUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/$($msi.Name)"
          $installer = "$installerUrl|x64|machine"

          .\wingetcreate.exe update $env:WINGET_PACKAGE_IDENTIFIER --urls $installer --version $version --submit --token $env:WATCHR_GITHUB_PAT --no-open
