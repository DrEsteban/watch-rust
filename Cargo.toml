[package]
name = "watch-rs"
version = "0.2.0"
description = "A Rust implementation of Linux's `watch` with extended features"
edition = "2021"
authors = ["DrEsteban"]
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/DrEsteban/watch-rust"
categories = ["command-line-utilities"]
exclude = [
    ".github",
    ".vscode"
]

[package.metadata.wix]
year = "2026"

[dependencies]
clap = { version = "4.6.1", features = ["derive", "cargo"] }
crossterm = "0.29.0"
indicatif = "0.18.4"
chrono = "0.4.44"
similar = "3.1.0"
console = "0.16.3"

[[bin]]
name = "watchr"
path = "src/main.rs"
